name: outcome probe
# Temporary: what outcome a step that exceeds timeout-minutes gets, and whether a later !cancelled() step runs.
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - id: slow
        timeout-minutes: 1
        run: sleep 100
      - if: ${{ !cancelled() }}
        run: echo "outcome=${{ steps.slow.outcome }} conclusion=${{ steps.slow.conclusion }} job=${{ job.status }}"
