name: release-publish
# release-flow/README.md "release-flow/merge-back", with the action from the copy under .release-ci/ and this branch as the default one.
on:
  release:
    types: [published]
concurrency:
  group: merge-back-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  merge-back:
    if: startsWith(github.event.release.tag_name, 'va-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.release-ci/release-flow/merge-back
        id: back
        with:
          tag: ${{ github.event.release.tag_name }}
          default-branch: test/vc-flow-20261017
          check-workflow: ci.yml
      - run: echo "version=${{ steps.back.outputs.version }} next=${{ steps.back.outputs.next }} landed=${{ steps.back.outputs.landed }}"
