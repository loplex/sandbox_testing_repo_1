name: Publish the accepted release

# The merge-back job of a plugin's release workflow, asked of release-ci so that what is tried here is what
# will run there. The publish job - the Marketplace upload - is left out: there is no plugin to upload.
on:
  release:
    types: [published]

concurrency:
  group: release-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  merge-back:
    name: Bump the version and land the branch on the default branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Asking for a Build run by hand is a write to Actions, answered 403 without this.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: loplex/release-ci/release-flow/merge-back@wip/check-release
        with:
          source: gradle.properties
          tag: ${{ github.event.release.tag_name }}
          default-branch: ${{ github.event.repository.default_branch }}
