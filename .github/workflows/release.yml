name: release
# release-flow/README.md "The release job", with the actions from the copy under .release-ci/ and a zip as the build.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release; left empty, the one gradle.properties declares
        default: ''
      skip-unreadable-releases:
        description: Pass over a release whose tag holds a CHANGELOG.md line the checks do not read
        type: boolean
        default: false
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/test/vc-flow-20261017'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.release-ci/release-flow/prepare
        id: cut
        with:
          version-source: gradle.properties
          tag-prefix: va-
          snapshot-suffix: -SNAPSHOT
          version: ${{ inputs.version }}
          repository-url: ${{ github.server_url }}/${{ github.repository }}
          skip-unreadable-releases: ${{ inputs.skip-unreadable-releases }}
      - name: What prepare left
        run: |
          echo "HEAD: $(git rev-parse HEAD) $(git branch --show-current || true)"
          git log --format='%h %s' -3 "${{ steps.cut.outputs.branch }}"
          git log -1 --format=%B HEAD
      - env:
          VERSION: ${{ steps.cut.outputs.version }}
        run: |
          mkdir -p build/distributions
          zip -j "build/distributions/demo-$VERSION.zip" gradle.properties CHANGELOG.md
      - uses: ./.release-ci/release-flow/draft
        with:
          version: ${{ steps.cut.outputs.version }}
          tag: ${{ steps.cut.outputs.tag }}
          branch: ${{ steps.cut.outputs.branch }}
          files: build/distributions/*.zip
