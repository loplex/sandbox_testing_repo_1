# Runs reproduce.sh once per job, each job on a fresh runner with one thing varied; the verdict is each job's
# summary.txt, and no job fails because a build failed.
name: reproduce

on:
  push:
    branches: [probe/detekt-stale-jar]
  workflow_dispatch:

jobs:
  reproduce:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # project/ as it is: Gradle's and the Kotlin Gradle plugin's defaults.
          - { name: default-1, args: '' }
          - { name: default-2, args: '' }
          - { name: debug, args: '-Prepro.detektDebug=true' }
          - { name: in-process, args: '-Pkotlin.compiler.execution.strategy=in-process' }
          - { name: clean-between-1, args: '--clean-between' }
          - { name: clean-between-2, args: '--clean-between' }
          - { name: build-cache, args: '--build-cache' }
          # Controls.
          - { name: second-only, args: '--second-only' }
          - { name: no-daemon, args: '--no-daemon' }
          - { name: worker-api-1, args: '-Pdetekt.use.worker.api=true' }
          - { name: worker-api-2, args: '-Pdetekt.use.worker.api=true' }
          - { name: configuration-cache, args: '--configuration-cache' }
          # As the project the bug was found in builds: configuration cache, build cache, Kotlin in-process.
          - { name: like-original, args: '--clean-between --configuration-cache --build-cache -Pkotlin.compiler.execution.strategy=in-process' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Reproduce
        run: |
          ./reproduce.sh ${{ matrix.args }}
          { echo "variant: ${{ matrix.name }} (${{ matrix.args }})"; cat build/logs/summary.txt; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: logs-${{ matrix.name }}
          path: build/logs/
