name: warn probe
# Temporary: exercises release-flow/warn (copied from release-ci's unpushed branch) against a published release.
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      mode:
        description: success, failure, skipped, or unrelated (publish succeeds, a later step fails), typo
        required: true
        type: string
      outcome-override:
        description: hand this to warn instead of the step's outcome ('-' for none)
        default: '-'
        type: string
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: A step before the publish
        id: before
        run: '[ "${{ inputs.mode }}" != skipped ]'
      - name: Publish (simulated)
        id: publish
        if: ${{ !cancelled() && steps.before.outcome == 'success' }}
        run: '[ "${{ inputs.mode }}" != failure ]'
      - name: An unrelated step after the publish
        if: ${{ !cancelled() }}
        run: '[ "${{ inputs.mode }}" != unrelated ]'
      - uses: ./.github/actions/warn-probe
        if: ${{ !cancelled() && inputs.mode != 'typo' }}
        with:
          tag: ${{ inputs.tag }}
          outcome: ${{ inputs.outcome-override != '-' && inputs.outcome-override || steps.publish.outcome }}
          to: the JetBrains Marketplace
      - uses: ./.github/actions/warn-probe
        if: ${{ !cancelled() && inputs.mode == 'typo' }}
        with:
          tag: ${{ inputs.tag }}
          outcome: ${{ steps.pubish.outcome }}
          to: the JetBrains Marketplace
