name: Prepare release

# What Prepare does in a plugin, without the parts that need a build: no Gradle, no signing, no Plugin
# Verifier. The point here is the shape - a release commit on a branch of its own and a draft whose tag does
# not exist until someone publishes it - and that shape is release-ci's, asked for rather than copied.
on:
  workflow_dispatch:

permissions:
  contents: write

# One at a time: two runs would race for the same release branch and the same draft.
concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: loplex/release-ci/release-flow/prepare@wip/check-release
        id: cut
        with:
          source: gradle.properties
          repository-url: ${{ github.server_url }}/${{ github.repository }}

      # Where a plugin builds and signs. There is nothing to build here, so a file stands in for the archive -
      # enough to see it attached to the draft.
      - run: echo "an archive would be attached here" > archive.txt

      - uses: loplex/release-ci/release-flow/draft@wip/check-release
        with:
          source: gradle.properties
          version: ${{ steps.cut.outputs.version }}
          tag: ${{ steps.cut.outputs.tag }}
          branch: ${{ steps.cut.outputs.branch }}
          files: archive.txt
