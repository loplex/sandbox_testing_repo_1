# dog-vision fd5b692e with Mesa installed system-wide: its Windows GL tests alone.
name: Windows GL Mesa ICD

on:
  push:

jobs:
  windows-gl:
    name: Windows GL tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y
      # Windows's own opengl32.dll has OpenGL 1.1 alone, where WglContext asks for 3.3 core, and the
      # runner has no GPU driver for it to hand WGL to: Mesa's llvmpipe is installed as the system's
      # OpenGL driver, by Mesa's own systemwidedeploy.cmd, choice 1, unattended, so that WGL reaches it
      # whatever loads opengl32.dll first, as Windows's shell does behind a JFileChooser. Its WGL alone:
      # Mesa's libEGL and libGLESv2 are not installed, as they could be taken for ANGLE's.
      - name: Install Mesa's OpenGL as the system's driver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo pal1000/mesa-dist-win --pattern "*release-msvc.7z" --output mesa.7z
          7z x mesa.7z -omesa | Out-Null
          $deploy = Get-ChildItem mesa -Recurse -Filter systemwidedeploy.cmd | Select-Object -First 1
          if (-not $deploy) { throw "Mesa's package has no systemwidedeploy.cmd" }
          cmd /c "`"$($deploy.FullName)`" 1"
          $driver = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL"
          Write-Host "The system's OpenGL driver: $($driver.DLL)"
          if ($driver.DLL -ne "mesadrv.dll" -or -not (Test-Path "$env:windir\System32\mesadrv.dll")) {
            throw "Mesa is not the system's OpenGL driver"
          }
      # ANGLE runs on Direct3D 11's software rasteriser, WARP, as the runner has no GPU. Mesa would
      # take its Direct3D 12 driver, which needs Mesa's dxil.dll, over llvmpipe. ffmpeg's own tests
      # run here too, for how a program is started on Windows.
      - run: ./gradlew :gui-core:jvmTest :ffmpeg:jvmTest
        env:
          GALLIUM_DRIVER: llvmpipe
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-gl-reports
          path: |
            gui-core/build/reports/
            gui-core/build/test-results/
            gui-core/hs_err_pid*.log
            ffmpeg/build/reports/
            ffmpeg/build/test-results/
