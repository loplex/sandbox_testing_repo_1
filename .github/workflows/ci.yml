name: ci
# Copied from release-ci's check-release/README.md, with the action called from the copy under .release-ci/, and master for main.
on:
  push:
    branches: [master]
  pull_request:
  # release-flow/merge-back starts this workflow by hand, as its check-workflow, once a release has landed.
  workflow_dispatch:

jobs:
  release-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.release-ci/check-release
        id: release
        with:
          version-source: gradle.properties
          checks: version changelog ancestry
