# On Linux:
# - the checks;
# - the Linux packages, installed, upgraded and removed;
# - every artifact Linux builds, built at once on a fresh tree.
# On Windows, what Linux cannot show:
# - the GL contexts of the desktop windows, under ANGLE and WGL;
# - the single MSI of both windows, the command line and the web page,
#   built with WiX and installed, upgraded and removed;
# - the command line's zip, built with jpackage and run.
# When run by hand, as before a release, and on a schedule, not on a push:
# - the Linux packages on every distribution docs/building.md says they pass on.
# The schedule runs them alone, weekly where main has changed since its last run, and every eighth week otherwise,
# as the distributions change what they install.
# keep-schedules.yml enables it again every month, as GitHub disables a schedule after 60 days without activity.
name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      distributions_only:
        description: Only the Linux packages on every distribution docs/building.md names
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"

jobs:
  linux:
    name: Linux checks
    if: github.event_name != 'schedule' && !inputs.distributions_only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # ffmpeg for the window's feed; Mesa's EGL and llvmpipe for its GL tests, as the runner has no GPU.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libegl-mesa0 libgl1-mesa-dri libgles2
      # The JVM tests' coverage, measured as `check` ran them, in one HTML report kept with the run.
      - run: ./gradlew check koverHtmlReport
      - uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: build/reports/kover/html/
      # The Linux packages, dog-vision-compose, dog-vision-swing, dog-vision-cli, dog-vision-common, dog-vision-web,
      # dog-vision-web-sourcemap and dog-vision, and a later version of each, which the build writes beside the first.
      - name: Build the debs and the rpms
        id: packages
        run: |
          sudo apt-get install -y rpm
          tasks=(:packaging:packageDeb :packaging:packageRpm)
          ./gradlew "${tasks[@]}"
          ./gradlew "${tasks[@]}" -PappVersion=0.1.1
      # Every deb must pass lintian with no errors or warnings,
      # except those each deb overrides, each with its reason.
      - name: Hold the debs to lintian
        if: (success() || failure()) && steps.packages.outcome == 'success'
        run: |
          sudo apt-get install -y lintian
          lintian --fail-on error,warning packaging/build/distributions/*.deb
      # Each in a bare Ubuntu 20.04, the oldest release their dependencies are named for,
      # upgraded to the later version; each window opens under Xvfb there, and the page's desktop entry is checked.
      # dog-vision then takes the place of dog-vision-compose and of the source map's dog-vision-web,
      # and dog-vision-cli takes dog-vision's.
      - name: Try the dog-vision-compose deb, then dog-vision in its place
        if: (success() || failure()) && steps.packages.outcome == 'success'
        run: >-
          tools/test_deb.sh --upgrade packaging/build/distributions/dog-vision-compose_0.1.1_amd64.deb
          --switch packaging/build/distributions/dog-vision_0.1.1_amd64.deb
          packaging/build/distributions/dog-vision-compose_0.1.0_amd64.deb ubuntu:20.04
      - name: Try the dog-vision-swing deb
        if: (success() || failure()) && steps.packages.outcome == 'success'
        run: >-
          tools/test_deb.sh --upgrade packaging/build/distributions/dog-vision-swing_0.1.1_amd64.deb
          packaging/build/distributions/dog-vision-swing_0.1.0_amd64.deb ubuntu:20.04
      - name: Try the dog-vision-cli deb
        if: (success() || failure()) && steps.packages.outcome == 'success'
        run: >-
          tools/test_deb.sh --upgrade packaging/build/distributions/dog-vision-cli_0.1.1_all.deb
          packaging/build/distributions/dog-vision-cli_0.1.0_all.deb ubuntu:20.04
      - name: Try the dog-vision-common deb
        if: (success() || failure()) && steps.packages.outcome == 'success'
        run: >-
          tools/test_deb.sh --upgrade packaging/build/distributions/dog-vision-common_0.1.1_all.deb
          packaging/build/distributions/dog-vision-common_0.1.0_all.deb ubuntu:20.04
      - name: Try the dog-vision-web deb
        if: (success() || failure()) && steps.packages.outcome == 'success'
        run: >-
          tools/test_deb.sh --upgrade packaging/build/distributions/dog-vision-web_0.1.1_all.deb
          packaging/build/distributions/dog-vision-web_0.1.0_all.deb ubuntu:20.04
      - name: Try the dog-vision-web-sourcemap deb, then dog-vision in dog-vision-web's place
        if: (success() || failure()) && steps.packages.outcome == 'success'
        run: >-
          tools/test_deb.sh --upgrade packaging/build/distributions/dog-vision-web-sourcemap_0.1.1_all.deb
          --switch packaging/build/distributions/dog-vision_0.1.1_amd64.deb
          packaging/build/distributions/dog-vision-web-sourcemap_0.1.0_all.deb ubuntu:20.04
      - name: Try the dog-vision deb, then dog-vision-cli in its place
        if: (success() || failure()) && steps.packages.outcome == 'success'
        run: >-
          tools/test_deb.sh --upgrade packaging/build/distributions/dog-vision_0.1.1_amd64.deb
          --switch packaging/build/distributions/dog-vision-cli_0.1.1_all.deb
          packaging/build/distributions/dog-vision_0.1.0_amd64.deb ubuntu:20.04
      # Each in a bare Fedora, with no desktop, upgraded and switched the same way.
      - name: Try the dog-vision-compose rpm, then dog-vision in its place
        if: (success() || failure()) && steps.packages.outcome == 'success'
        run: >-
          tools/test_rpm.sh --upgrade packaging/build/distributions/dog-vision-compose-0.1.1-1.x86_64.rpm
          --switch packaging/build/distributions/dog-vision-0.1.1-1.x86_64.rpm
          packaging/build/distributions/dog-vision-compose-0.1.0-1.x86_64.rpm fedora:42
      - name: Try the dog-vision-swing rpm
        if: (success() || failure()) && steps.packages.outcome == 'success'
        run: >-
          tools/test_rpm.sh --upgrade packaging/build/distributions/dog-vision-swing-0.1.1-1.x86_64.rpm
          packaging/build/distributions/dog-vision-swing-0.1.0-1.x86_64.rpm fedora:42
      # dog-vision-cli brings a headless Java, which a window installed after it must pass over.
      - name: Try the dog-vision-cli rpm, then dog-vision-compose beside it
        if: (success() || failure()) && steps.packages.outcome == 'success'
        run: >-
          tools/test_rpm.sh --upgrade packaging/build/distributions/dog-vision-cli-0.1.1-1.noarch.rpm
          --switch packaging/build/distributions/dog-vision-compose-0.1.1-1.x86_64.rpm
          packaging/build/distributions/dog-vision-cli-0.1.0-1.noarch.rpm fedora:42
      - name: Try the dog-vision-common rpm
        if: (success() || failure()) && steps.packages.outcome == 'success'
        run: >-
          tools/test_rpm.sh --upgrade packaging/build/distributions/dog-vision-common-0.1.1-1.noarch.rpm
          packaging/build/distributions/dog-vision-common-0.1.0-1.noarch.rpm fedora:42
      - name: Try the dog-vision-web rpm
        if: (success() || failure()) && steps.packages.outcome == 'success'
        run: >-
          tools/test_rpm.sh --upgrade packaging/build/distributions/dog-vision-web-0.1.1-1.noarch.rpm
          packaging/build/distributions/dog-vision-web-0.1.0-1.noarch.rpm fedora:42
      - name: Try the dog-vision-web-sourcemap rpm, then dog-vision in dog-vision-web's place
        if: (success() || failure()) && steps.packages.outcome == 'success'
        run: >-
          tools/test_rpm.sh --upgrade packaging/build/distributions/dog-vision-web-sourcemap-0.1.1-1.noarch.rpm
          --switch packaging/build/distributions/dog-vision-0.1.1-1.x86_64.rpm
          packaging/build/distributions/dog-vision-web-sourcemap-0.1.0-1.noarch.rpm fedora:42
      - name: Try the dog-vision rpm, then dog-vision-cli in its place
        if: (success() || failure()) && steps.packages.outcome == 'success'
        run: >-
          tools/test_rpm.sh --upgrade packaging/build/distributions/dog-vision-0.1.1-1.x86_64.rpm
          --switch packaging/build/distributions/dog-vision-cli-0.1.1-1.noarch.rpm
          packaging/build/distributions/dog-vision-0.1.0-1.x86_64.rpm fedora:42
      # The tar.gz, unpacked and run where it is, on its own runtime:
      # the command line converting a photo, and the window's main answering --help.
      - name: Build the tar.gz and try it
        if: success() || failure()
        run: |
          ./gradlew :packaging:packageDogVisionComposeTarGz
          tar -xzf packaging/build/distributions/dog-vision-compose-0.1.0-linux-x64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/dog-vision-compose/bin/dog-vision-compose" --help
          cp tools/test_photo.jpg "$RUNNER_TEMP"
          "$RUNNER_TEMP/dog-vision-compose/bin/dog-vision-cli" "$RUNNER_TEMP/test_photo.jpg"
          test -s "$RUNNER_TEMP/test_photo.dog.png"
      # The Swing window's, the same way.
      - name: Build the dog-vision-swing tar.gz and try it
        if: success() || failure()
        run: |
          ./gradlew :packaging:packageDogVisionSwingTarGz
          tar -xzf packaging/build/distributions/dog-vision-swing-0.1.0-linux-x64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/dog-vision-swing/bin/dog-vision-swing" --help
          mkdir "$RUNNER_TEMP/swing" && cp tools/test_photo.jpg "$RUNNER_TEMP/swing"
          "$RUNNER_TEMP/dog-vision-swing/bin/dog-vision-cli" "$RUNNER_TEMP/swing/test_photo.jpg"
          test -s "$RUNNER_TEMP/swing/test_photo.dog.png"
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: linux-reports
          path: |
            **/build/reports/
            **/hs_err_pid*.log

  # Every artifact Linux can build, the uber JARs among them, as the first build of a fresh tree:
  # a task that reads another's output while Gradle plans the build fails only where that output is not built yet,
  # and the Linux job's check has built it before that job packages.
  package-all:
    name: Linux packageAll
    if: github.event_name != 'schedule' && !inputs.distributions_only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: ./gradlew packageAll

  # The debs and the rpms for the distributions' jobs below, built apart from the Linux job's,
  # which builds them only once its check has passed.
  distribution-packages:
    name: Build the packages for the distributions
    needs: distribution-plan
    if: needs.distribution-plan.outputs.due == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: |
          sudo apt-get update && sudo apt-get install -y rpm
          tasks=(:packaging:packageDeb :packaging:packageRpm)
          ./gradlew "${tasks[@]}"
          ./gradlew "${tasks[@]}" -PappVersion=0.1.1
      - uses: actions/upload-artifact@v5
        with:
          name: distribution-packages
          path: |
            packaging/build/distributions/*.deb
            packaging/build/distributions/*.rpm
          retention-days: 3

  # One job for each package on each distribution docs/building.md names, as the Linux job tries them on two:
  # upgraded, then switched to dog-vision, or dog-vision to dog-vision-cli, where the package manager can switch;
  # besides, dog-vision switched to some of the packages it holds, and the Java programs on Temurin's JRE.
  distribution-plan:
    name: Plan the distributions' jobs
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    outputs:
      due: ${{ steps.plan.outputs.due }}
      include: ${{ steps.plan.outputs.include }}
    steps:
      - id: plan
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import datetime, json, os, urllib.request

          due = True
          if os.environ["GITHUB_EVENT_NAME"] == "schedule":
              # The schedule's runs before this one, the latest first.
              url = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                     "/actions/workflows/ci.yml/runs?event=schedule&per_page=5")
              headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"}
              runs = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=headers)))["workflow_runs"]
              earlier = [run for run in runs if run["id"] != int(os.environ["GITHUB_RUN_ID"])]
              changed = not earlier or earlier[0]["head_sha"] != os.environ["GITHUB_SHA"]
              # Weeks counted on without a break at the year's end, as ISO's week numbers are not.
              due = changed or datetime.date.today().toordinal() // 7 % 8 == 0
              print("main changed since the last scheduled run" if changed else "main unchanged", "- due:", due)
          debs = ["ubuntu:20.04", "ubuntu:22.04", "ubuntu:24.04", "debian:12"]
          rpms = ["fedora:42", "opensuse/leap:15.6", "rockylinux/rockylinux:9-minimal"]
          native = {"dog-vision-compose", "dog-vision-swing", "dog-vision"}
          packages = ["dog-vision-compose", "dog-vision-swing", "dog-vision-cli", "dog-vision-common",
                      "dog-vision-web", "dog-vision-web-sourcemap", "dog-vision"]

          def file(image, name, version):
              if image in debs:
                  return f"dist/{name}_{version}_{'amd64' if name in native else 'all'}.deb"
              return f"dist/{name}-{version}-1.{'x86_64' if name in native else 'noarch'}.rpm"

          include = []
          def add(image, name, switch=None, temurin=False):
              args = (["--temurin"] if temurin else []) + ["--upgrade", file(image, name, "0.1.1")]
              if switch:
                  args += ["--switch", file(image, switch, "0.1.1")]
              args += [file(image, name, "0.1.0"), image]
              label = name + (f" -> {switch}" if switch else "") + (" on Temurin" if temurin else "")
              include.append({
                  "name": f"{label}, {image}",
                  "script": "tools/test_deb.sh" if image in debs else "tools/test_rpm.sh",
                  "args": " ".join(args),
              })

          for image in debs + rpms:
              # Rocky's minimal image has microdnf, which removes no package to install another.
              switching = "rockylinux" not in image
              for name in packages:
                  target = "dog-vision-cli" if name == "dog-vision" else "dog-vision"
                  add(image, name, target if switching else None)
          for image in ["ubuntu:20.04", "fedora:42", "opensuse/leap:15.6"]:
              for target in ["dog-vision-compose", "dog-vision-swing", "dog-vision-common", "dog-vision-web"]:
                  add(image, "dog-vision", target)
          for image in ["ubuntu:24.04", "fedora:42"]:
              for name in ["dog-vision-compose", "dog-vision-swing", "dog-vision-cli", "dog-vision"]:
                  add(image, name, temurin=True)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"due={'true' if due else 'false'}\n")
              out.write(f"include={json.dumps(include)}\n")
          print(len(include), "jobs")

  distributions:
    name: ${{ matrix.name }}
    needs: [distribution-packages, distribution-plan]
    if: needs.distribution-plan.outputs.due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.distribution-plan.outputs.include) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: distribution-packages
          path: dist
      - run: ${{ matrix.script }} ${{ matrix.args }}

  windows-gl:
    name: Windows GL tests
    if: github.event_name != 'schedule' && !inputs.distributions_only
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress -y
      # opengl32.dll hands WGL to the GPU's driver;
      # with none, as on the runner, it has only Windows's own OpenGL 1.1, where WglContext asks for 3.3 core.
      # The window draws through ANGLE first, on Direct3D 11, which Windows has without a driver too;
      # WGL is its fallback.
      # Mesa's llvmpipe is installed as the system's OpenGL driver,
      # by Mesa's own systemwidedeploy.cmd, choice 1, unattended,
      # so that WGL reaches it whatever loads opengl32.dll first, as Windows's shell does behind a JFileChooser.
      # Its WGL alone: Mesa's libEGL and libGLESv2 are not installed, as they could be taken for ANGLE's.
      - name: Install Mesa's OpenGL as the system's driver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo pal1000/mesa-dist-win --pattern "*release-msvc.7z" --output mesa.7z
          7z x mesa.7z -omesa | Out-Null
          $deploy = Get-ChildItem mesa -Recurse -Filter systemwidedeploy.cmd | Select-Object -First 1
          if (-not $deploy) { throw "Mesa's package has no systemwidedeploy.cmd" }
          cmd /c "`"$($deploy.FullName)`" 1"
          $driver = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\OpenGLDrivers\MSOGL"
          Write-Host "The system's OpenGL driver: $($driver.DLL)"
          if ($driver.DLL -ne "mesadrv.dll" -or -not (Test-Path "$env:windir\System32\mesadrv.dll")) {
            throw "Mesa is not the system's OpenGL driver"
          }
      # ANGLE runs on Direct3D 11's software rasteriser, WARP, as the runner has no GPU.
      # Mesa would take its Direct3D 12 driver, which needs Mesa's dxil.dll, over llvmpipe.
      # ffmpeg's own tests run here too, for how a program is started on Windows.
      - run: ./gradlew :gui-core:jvmTest :ffmpeg:jvmTest
        env:
          GALLIUM_DRIVER: llvmpipe
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-gl-reports
          path: |
            gui-core/build/reports/
            gui-core/build/test-results/
            gui-core/hs_err_pid*.log
            ffmpeg/build/reports/
            ffmpeg/build/test-results/

  windows-msi:
    name: Windows MSI
    if: github.event_name != 'schedule' && !inputs.distributions_only
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # WiX Toolset 3.14 comes with the runner's image, which names it by WIX.
      # The MSI, and a later version of it.
      - name: Build the MSIs
        shell: pwsh
        run: |
          ./tools/package_msi_on_windows.ps1
          ./tools/package_msi_on_windows.ps1 -AppVersion 0.1.1
      - name: Install, upgrade and remove it
        shell: pwsh
        run: >-
          ./tools/test_msi_on_windows.ps1
          -Msi tools/build/msi/dog-vision-0.1.0.msi -Version 0.1.0
          -UpgradeMsi tools/build/msi/dog-vision-0.1.1.msi -UpgradeVersion 0.1.1
          -LogDir msi-logs
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-msi
          path: |
            tools/build/msi/
            msi-logs/

  windows-zip:
    name: Windows zip
    if: github.event_name != 'schedule' && !inputs.distributions_only
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the command line's zip
        shell: pwsh
        run: ./tools/package_cli_zip_on_windows.ps1
      - name: Unpack the zip and run the command line
        shell: pwsh
        run: >-
          ./tools/test_cli_zip_on_windows.ps1
          -Zip tools/build/zip/dog-vision-cli-0.1.0-windows-x64.zip
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-zip
          path: tools/build/zip/
