name: ci

# Checks the branch that plays the default branch of this throwaway project.
# merge-back dispatches it once a release has landed.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.release-ci/check-release
        with:
          version-source: gradle.properties
          tag-prefix: ^none
