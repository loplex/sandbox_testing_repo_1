name: ci
# check-release/README.md's example, with the action from the copy under .release-ci/ and this branch as the default one.
on:
  push:
    branches: [test/vc-flow-20261017]
  pull_request:
  workflow_dispatch:

jobs:
  release-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: origin/HEAD in the checkout
        run: git symbolic-ref -q refs/remotes/origin/HEAD || echo none
      - uses: ./.release-ci/check-release
        id: release
        with:
          version-source: gradle.properties
          tag-prefix: va-
          checks: version changelog ancestry
          snapshot-suffix: -SNAPSHOT
          default-branch: test/vc-flow-20261017
      - run: echo "version=${{ steps.release.outputs.version }} channel=${{ steps.release.outputs.channel }}"
