# The Linux packages, every one on every distribution tools/test_deb.sh and tools/test_rpm.sh are
# said to hold on, in parallel: each upgraded to a later version and then switched to the package
# that takes its place, dog-vision for each it holds and the source map's dog-vision-web, and
# dog-vision-cli for dog-vision; besides, dog-vision switched to each window, the page and the
# shared JARs, and the JVM programs on Temurin.
name: Package matrix

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build the debs and the rpms
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: |
          sudo apt-get update && sudo apt-get install -y rpm
          tasks=(:packaging:packageDeb :packaging:packageRpm)
          ./gradlew "${tasks[@]}"
          ./gradlew "${tasks[@]}" -PappVersion=0.1.1
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            packaging/build/distributions/*.deb
            packaging/build/distributions/*.rpm
          retention-days: 3

  plan:
    name: Plan the matrix
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - id: plan
        shell: python
        run: |
          import json, os
          debs = ["ubuntu:20.04", "ubuntu:22.04", "ubuntu:24.04", "debian:12"]
          rpms = ["fedora:42", "opensuse/leap:15.6", "rockylinux/rockylinux:9-minimal"]
          native = {"dog-vision-compose", "dog-vision-swing", "dog-vision"}
          packages = ["dog-vision-compose", "dog-vision-swing", "dog-vision-cli", "dog-vision-common",
                      "dog-vision-web", "dog-vision-web-sourcemap", "dog-vision"]

          def file(image, name, version):
              d = "dist"
              if image in debs:
                  return f"{d}/{name}_{version}_{'amd64' if name in native else 'all'}.deb"
              return f"{d}/{name}-{version}-1.{'x86_64' if name in native else 'noarch'}.rpm"

          include = []
          def add(image, name, switch=None, upgrade=True, temurin=False):
              args = ["--temurin"] if temurin else []
              if upgrade:
                  args += ["--upgrade", file(image, name, "0.1.1")]
              if switch:
                  args += ["--switch", file(image, switch, "0.1.1" if upgrade else "0.1.0")]
              args += [file(image, name, "0.1.0"), image]
              label = name + (f" -> {switch}" if switch else "") + (" (Temurin)" if temurin else "")
              include.append({
                  "name": f"{label} on {image}",
                  "script": "tools/test_deb.sh" if image in debs else "tools/test_rpm.sh",
                  "args": " ".join(args),
              })

          for image in debs + rpms:
              # microdnf removes no package to install another.
              switching = "microdnf" not in image and "rockylinux" not in image
              for name in packages:
                  target = "dog-vision-cli" if name == "dog-vision" else "dog-vision"
                  add(image, name, target if switching else None)
          for image in ["ubuntu:20.04", "fedora:42", "opensuse/leap:15.6"]:
              for target in ["dog-vision-compose", "dog-vision-swing", "dog-vision-common", "dog-vision-web"]:
                  add(image, "dog-vision", target)
          for image in ["ubuntu:24.04", "fedora:42"]:
              for name in ["dog-vision-compose", "dog-vision-swing", "dog-vision-cli", "dog-vision"]:
                  add(image, name, temurin=True)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"include={json.dumps(include)}\n")
          print(len(include), "jobs")

  test:
    name: ${{ matrix.name }}
    needs: [build, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - run: ${{ matrix.script }} ${{ matrix.args }}
