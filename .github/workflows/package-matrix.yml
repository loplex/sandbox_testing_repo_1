# The Linux packages, every one on every distribution tools/test_deb.sh and tools/test_rpm.sh are
# said to hold on, in parallel: each upgraded to a later version and then switched to the package
# that takes its place, dog-vision for each it holds and the source map's dog-vision-web, and
# dog-vision-cli for dog-vision; besides, dog-vision switched to each window, the page and the
# shared JARs, and the JVM programs on Temurin.
name: Package matrix

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build the debs and the rpms
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: |
          sudo apt-get update && sudo apt-get install -y rpm
          tasks=(:packaging:packageDeb :packaging:packageRpm)
          ./gradlew "${tasks[@]}"
          ./gradlew "${tasks[@]}" -PappVersion=0.1.1
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            packaging/build/distributions/*.deb
            packaging/build/distributions/*.rpm
          retention-days: 3

  plan:
    name: Plan the probe
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - id: plan
        run: |
          echo 'include=[{"name": "fedora: cli -> dog-vision", "args": "--upgrade dist/dog-vision-cli-0.1.1-1.noarch.rpm --switch dist/dog-vision-0.1.1-1.x86_64.rpm dist/dog-vision-cli-0.1.0-1.noarch.rpm fedora:42"}, {"name": "fedora: cli then dog-vision-compose", "args": "--switch dist/dog-vision-compose-0.1.0-1.x86_64.rpm dist/dog-vision-cli-0.1.0-1.noarch.rpm fedora:42"}, {"name": "leap: compose -> dog-vision", "args": "--upgrade dist/dog-vision-compose-0.1.1-1.x86_64.rpm --switch dist/dog-vision-0.1.1-1.x86_64.rpm dist/dog-vision-compose-0.1.0-1.x86_64.rpm opensuse/leap:15.6"}, {"name": "leap: compose then dog-vision-swing", "args": "--switch dist/dog-vision-swing-0.1.0-1.x86_64.rpm dist/dog-vision-compose-0.1.0-1.x86_64.rpm opensuse/leap:15.6"}]' >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.name }}
    needs: [build, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - run: tools/test_rpm_verbose.sh ${{ matrix.args }}
        env:
          JAVA_TOOL_OPTIONS: -Dorg.lwjgl.util.Debug=true -Dorg.lwjgl.util.DebugLoader=true
