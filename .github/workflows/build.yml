name: Build

# The release rules alone, which is all this sandbox has: there is nothing here to compile. Named `Build`
# because the release workflow asks for build.yml by hand after it has pushed.
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Check the release rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # Asked of release-ci rather than of a copy kept here. Pinned to the branch the rules are being worked on,
      # which is what this sandbox is for: trying them before a plugin depends on them.
      - uses: loplex/release-ci/check-release@wip/check-release
        with:
          source: gradle.properties
