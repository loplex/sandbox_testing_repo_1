name: Build

# The release rules alone, which is all this sandbox has: there is nothing here to compile. Named `Build`
# because the release workflow asks for build.yml by hand after it has pushed.
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Check the release rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      # Asked of release-ci rather than of a copy kept here, pinned to a release tag as its README asks of every
      # consumer. Trying a change before a plugin depends on it means pointing these at the branch it is on.
      - uses: loplex/release-ci/check-release@v0.1.0
        with:
          source: gradle.properties
