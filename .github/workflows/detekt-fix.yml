# Tries patches/clear-jar-caches.patch on detekt's main: its test with and without the fix, detekt-core's tests and
# self-check with it, and reproduce.sh against detekt built with it. No job fails because a step it checks failed;
# the verdict is each job's summary.txt. Runs when this file or the patch changes.
name: detekt fix

on:
  push:
    branches: [probe/detekt-stale-jar]
    paths: ['.github/workflows/detekt-fix.yml', 'patches/**']
  workflow_dispatch:

env:
  DETEKT_COMMIT: 641d9b31501776eb9a5c5b86141a313d83fc540c

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # The new test alone, the fix left out: it has to fail.
          - { name: test-unfixed, apply: '--include=*Spec.kt', run: test }
          # The fix and its test, all of detekt-core's tests, and detekt on detekt-core.
          - { name: test-fixed, apply: '', run: test }
          # reproduce.sh against detekt built with the fix: it has to pass.
          - { name: repro-fixed-1, apply: '', run: repro }
          - { name: repro-fixed-2, apply: '', run: repro }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: detekt/detekt
          ref: ${{ env.DETEKT_COMMIT }}
          path: detekt-src
      # detekt's build-logic asks for a JDK 17 toolchain; the builds run on 25.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            25
      - name: Apply the patch
        working-directory: detekt-src
        run: |
          git apply ${{ matrix.apply }} ../patches/clear-jar-caches.patch
          git status --short
      - name: Test
        if: matrix.run == 'test'
        working-directory: detekt-src
        run: |
          set +e
          mkdir -p ../build/logs
          ./gradlew :detekt-core:test --tests dev.detekt.core.settings.EnvironmentFacadeSpec --no-configuration-cache \
            > ../build/logs/spec.log 2>&1
          echo "EnvironmentFacadeSpec: exit=$?" | tee -a ../build/logs/summary.txt
          if [ "${{ matrix.name }}" = test-fixed ]; then
            ./gradlew :detekt-core:test :detekt-core:detektMain :detekt-core:detektTest --continue --no-configuration-cache \
              > ../build/logs/detekt-core.log 2>&1
            echo "detekt-core test detektMain detektTest: exit=$?" | tee -a ../build/logs/summary.txt
          fi
          cp -r detekt-core/build/test-results ../build/logs/ 2>/dev/null
          cat ../build/logs/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publish detekt to Maven Local
        if: matrix.run == 'repro'
        working-directory: detekt-src
        run: ./gradlew publishToMavenLocal -Dsnapshot=true -x dokkaGenerate --no-configuration-cache
      - name: Reproduce
        if: matrix.run == 'repro'
        run: |
          set -eu
          sed -i 's/id("dev.detekt") version "2.0.0-alpha.6"/id("dev.detekt") version "main-SNAPSHOT"/' project/build.gradle.kts
          sed -i 's/^\( *\)mavenCentral()$/\1mavenLocal()\n&/' project/settings.gradle.kts
          rm -rf detekt-src
          git diff --stat
          ./reproduce.sh -Prepro.detektDebug=true
          cat build/logs/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: logs-${{ matrix.name }}
          path: build/logs/
