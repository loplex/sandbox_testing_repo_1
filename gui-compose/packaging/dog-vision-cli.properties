# jpackage's second launcher, dog-vision-cli: the command line alone, which, given no photo to convert, says that the
# window is the desktop app's rather than open it, and on Windows runs in a console, as the window's launcher does
# not. It gets no entry in the Linux desktop's menu, where it would only say that.
main-class=cz.loplex.dogvision.cli.MainKt
win-console=true
linux-shortcut=false
