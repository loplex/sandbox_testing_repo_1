# jpackage's second launcher, dog-vision-cli: the command line alone,
# which, given no photo to convert, says that the window is the desktop app's rather than open it,
# and on Windows runs in a console, as the window's launcher does not.
# It gets no entry in the Linux desktop's menu, nor in Windows's Start menu or on its desktop,
# where it would only say that; jpackage takes the two Windows keys from JDK 18 on,
# and JDK 17's, which package_msi_on_linux.sh runs, passes over them.
main-class=cz.loplex.dogvision.cli.MainKt
win-console=true
win-menu=false
win-shortcut=false
linux-shortcut=false
