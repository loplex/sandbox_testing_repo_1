# jpackage's second launcher in the Linux app images that the tar.gz packages hold, next to the window's:
# dog-vision-cli, the command line on its own,
# which, given no file to convert, prints its usage instead of opening the window.
# It gets no entry in the desktop's menu, where it would only print that.
# The MSI's launchers come from the modules' windowsLauncher tasks instead.
main-class=cz.loplex.dogvision.cli.MainKt
linux-shortcut=false
