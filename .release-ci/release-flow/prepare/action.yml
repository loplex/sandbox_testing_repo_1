name: prepare
description: |
  Cuts the release commit onto a branch of its own.

  1. Runs the checks `changelog`, `ancestry` and `version`.
     If any of them fails, nothing is written.
  2. Closes `[Unreleased]` in CHANGELOG.md into a section for the version being released.
     An `[Unreleased]` with nothing to release is refused, and nothing is written either.
  3. Writes that version where `version-source` declares one.
  4. Commits the result onto the branch `release/<version>`: the release commit.
     The commit records how the release was made, as `Release-CI-*` git trailers,
     which release-flow/merge-back and intellij/build read instead of being given them again.
  5. Where `version-source` declares a version, starts the next one in a second commit above the release commit,
     so that release-flow/merge-back writes nothing.
  6. Leaves the release commit checked out, detached, for the build.
     Where it started the next version, the branch is one commit further.

  Nothing is built, pushed or drafted.
  The build runs from this commit next, and a build that fails should leave nothing behind on the remote.
  release-flow/draft pushes the branch and drafts the release once the build has succeeded.

  Runs after a checkout of the default branch with `fetch-depth: 0`, and refuses a shallow one.
  The calling job has to make sure of that: nothing here checks which branch was checked out.
  Needs no permissions of its own, because it writes nothing outside the workspace.
  release-flow/draft, in the same job, needs `contents: write`.
  Installs the Python it runs on with actions/setup-python, leaving the job's own python3 as it was.

inputs:
  version-source:
    description: |
      Where the version of the next release comes from:
      - `gradle.properties`: the file declares it in `version`.
      - `gradle.properties:<key>`: the file declares it in `<key>`, such as `appVersion`.
      - `maven`: Maven reads and writes it in `pom.xml`; `maven:<property>`, in that property.
      - `command`: `version-read-command` prints it and `version-write-command` writes it.
      - `tags`: no file declares it.

      check-release's action describes each in full.
    required: true
  version-read-command:
    description: |
      Under `version-source: command`, the shell command that prints the version, as check-release takes it.
    default: ''
  version-write-command:
    description: |
      Under `version-source: command`, the shell command that writes the version, which `VERSION` holds in its
      environment: `sed -i "s/^version=.*/version=$VERSION/" gradle.properties`, say.
      It runs with bash in the root of the repository, twice: for the version released, and for the next one.
      The version reaches it only so, never written into the command.
    default: ''
  tag-prefix:
    description: |
      What a release tag has in front of the version: `v` for `v0.1.0`.
      - Needed until a release whose commit records the prefix is reachable: this action records it there,
        and it is read there from then on.
      - `^none`: the tags have no prefix at all.

      check-release's action describes it in full.
    default: ''
  snapshot-suffix:
    description: |
      What the version carries between releases, after the release's version: `-SNAPSHOT` in `0.2.1-SNAPSHOT`.
      - Required where the source declares a version, under every one but `tags`; a hyphen and one identifier
        of letters and digits, holding a letter.
      - `^none`: the version carries nothing between releases.
      - Left out under `tags`, which keeps no version between releases.

      Recorded in the release commit, and appended to the next version this starts.
      The release takes off the suffix a release before it recorded where one applies, so a suffix changed here
      shows from the next version on, and this one otherwise; lib/README.md says which under The snapshot suffix.
    default: ''
  version:
    description: |
      The version to release, instead of the one `version-source` gives.
      This is what a dispatch input passes on.
      - Under a source that declares a version: `0.2.0` or `0.2.0-SNAPSHOT`; the snapshot suffix at the end is
        dropped.
      - Under `tags`: `0.2.0`.
        Left empty, the version after the highest release is released,
        or a later one where `[Unreleased]` asks for more.

      The `version` output has no snapshot suffix under any source.
    default: ''
  repository-url:
    description: |
      The repository's URL, to write the changelog's version links with.
      The usual value is `github.server_url` and `github.repository` joined by a slash.
      - Given: the link of each version is written afresh, comparing it with the release before it.
        A final release is compared with the final release before it.
        Any other link definition in the changelog stays as it is.
      - Left empty: the changelog's link definitions are left alone.
    default: ''
  skip-unreadable-releases:
    description: |
      `true` names as not compared a release whose tag holds a line of CHANGELOG.md the `changelog` check
      does not read, instead of failing.
      check-release's action describes it in full.
    default: 'false'
  html-notes:
    description: |
      `true` has the `changelog` check refuse raw HTML under `[Unreleased]` other than a comment, such as `<kbd>`,
      before the release is cut: for a project whose release notes are also rendered as HTML,
      as intellij/build's `change-notes` does.
      check-release's action describes it in full.
    default: 'false'

outputs:
  version:
    description: |
      The version being released, without the tag prefix and without the snapshot suffix.
    value: ${{ steps.prepare.outputs.version }}
  tag:
    description: |
      The name the release tag will have once the draft is published.
    value: ${{ steps.prepare.outputs.tag }}
  branch:
    description: |
      The branch that holds the release commit.
      The workspace is left at the release commit, detached, not on the branch.
    value: ${{ steps.prepare.outputs.branch }}

runs:
  using: composite
  steps:
    # The Python .python-version names, the one the tests run on, whatever python3 the runner carries.
    # update-environment: false keeps it out of the calling job, whose steps go on with their own python3.
    - id: python
      uses: actions/setup-python@v7
      with:
        python-version-file: ${{ github.action_path }}/../../.python-version
        update-environment: false
    - id: prepare
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        VERSION_SOURCE: ${{ inputs.version-source }}
        VERSION_READ_COMMAND: ${{ inputs.version-read-command }}
        VERSION_WRITE_COMMAND: ${{ inputs.version-write-command }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        VERSION: ${{ inputs.version }}
        SNAPSHOT_SUFFIX: ${{ inputs.snapshot-suffix }}
        REPOSITORY_URL: ${{ inputs.repository-url }}
        SKIP_UNREADABLE_RELEASES: ${{ inputs.skip-unreadable-releases }}
        HTML_NOTES: ${{ inputs.html-notes }}
      # The Python setup-python installs finds its libpython through LD_LIBRARY_PATH in a job that runs in a container,
      # where the tool cache is mounted away from the path built into it. Set here, for this step alone.
      run: |
        export LD_LIBRARY_PATH="${PYTHON%/bin/*}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        "$GITHUB_ACTION_PATH/prepare.sh"
