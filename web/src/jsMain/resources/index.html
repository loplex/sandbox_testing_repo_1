<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Dog vision</title>
    <!-- No icon: without one, a browser asks the server for favicon.ico. -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="bar">
    <h1 id="title">Dog vision</h1>
    <label class="button">
        <input id="open" type="file" accept="image/*">
        <span id="open-text">Open a photo</span>
    </label>
</header>
<main class="page">
    <section id="stage" class="stage">
        <canvas id="view"></canvas>
        <div id="captions"></div>
        <p id="prompt" class="prompt" role="status"></p>
    </section>
    <aside id="controls" class="controls"></aside>
</main>
<script src="dog-vision.js"></script>
</body>
</html>
