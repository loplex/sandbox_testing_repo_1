# A sandbox for the release pipeline, not a real project: there is no Gradle build here, and this file exists
# because check-release.py reads the version and the tag spelling out of it, as it does in the plugins.
version = 0.1.2-SNAPSHOT
# Deliberately not the plugins' empty prefix: tags are `v0.1.0` here and branches `release/0.1.0`, so the two
# spellings are told apart by anything that has to name both.
tagPrefix = v
